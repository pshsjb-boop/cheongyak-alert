name: 청약 알림

on:
  schedule:
    - cron: "7 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 청약 일정 조회 후 텔레그램 전송
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REGIONS: ${{ vars.REGIONS }}
          INCLUDE_OFFICETEL: ${{ vars.INCLUDE_OFFICETEL }}
          SKIP_EMPTY: ${{ vars.SKIP_EMPTY }}
        run: python cheongyak_alert.py
      - name: 실거래가 페이지 만들기 + 텔레그램 요약
        if: always()
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python apt_site.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen*.json data docs || true
          git diff --cached --quiet || git commit -m "업데이트 $(date +%F)"
          git push
